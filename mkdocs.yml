site_name: WAMF Documentation
site_description: Documentation for the Wildlife Activity Monitoring Framework
site_url: https://docs.wamf.uk

repo_name: WAMF-Project/WAMF-Docs
repo_url: https://github.com/WAMF-Project/WAMF-Docs

theme:
  name: material
  logo: assets/images/WAMF-Header.png
  favicon: assets/icons/favicon.svg
  palette:
    scheme: slate
    
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/extra.css
  
nav:
  - Home: index.md
  - Releases:
      - v0.4.3: releases/0.4.3.md
      - v0.4.2: releases/0.4.2.md
  - Getting Started:
      - What is WAMF?: getting-started/what-is-wamf.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
  - User Guide:
      - Dashboard: user-guide/dashboard.md
      - Daily Summary: user-guide/daily-summary.md
      - Recent Feed: user-guide/recent-feed.md
      - Activity: user-guide/activity.md
      - Live View: user-guide/live-view.md
      - Species: user-guide/species.md
      - Media Retention: user-guide/media-retention.md
  - Administration:
     - Overview: administration/overview.md
     - Species Metadata: administration/species-metadata.md
     - System Logs: administration/system-events.md
     - Authentication: administration/authentication.md
     - Configuration: administration/configuration.md

  - Deployment:
      - Frigate Configuration: deployment/frigate.md
      - Docker: deployment/docker.md
      - Updating: deployment/updating.md
      - Backups: deployment/backups.md
  - Developer Guide:
      - Project Structure: developer-guide/project-structure.md
     
      
  - Reference:
      - Configuration: reference/configuration.md
      - REST API: reference/rest-api.md
      - FAQ: reference/faq.md
      - Security: reference/security.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

copyright: Copyright &copy; 2026 WAMF
